  <main id="app"></main>
  <script>
  (() => {
    const KEY='badman-undercover:sessions', ACTIVE='badman-undercover:active';
    // 部署 Google Apps Script 後，把 Web App 網址貼到引號內；留白時資料只存在此瀏覽器。
    const GOOGLE_APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbymfYD1O9936DbgRGwyLh_GWkCXpWcgA7TxJHyYAoSzHrGY-DnLHENXIkx7xh9yfx8vlA/exec';
    const $=s=>document.querySelector(s), app=$('#app');
    const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
    const sessions=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}};
    const save=items=>localStorage.setItem(KEY,JSON.stringify(items));
    const active=()=>sessions().find(s=>s.id===localStorage.getItem(ACTIVE));
    const update=(sid,patch)=>save(sessions().map(s=>s.id===sid?{...s,...patch}:s));
    const pushToGoogle=(event,data)=>{
      if(!GOOGLE_APPS_SCRIPT_URL) return;
      fetch(GOOGLE_APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({event,...data})}).catch(()=>{});
    };
    const opts=(...a)=>a;
    const q=(id,section,title,options,kind='single',desc='')=>({id,section,title,options,kind,desc});
    const o=(id,label,h=0,l=0,r=0,p=0)=>({id,label,h,l,r,p});
    const questions=[
      q('relationship','關係背景','妳和他的關係比較接近哪一種？',opts(o('married','他已婚',4),o('partner','他有女友或固定伴侶',4),o('situationship','曖昧很久，但一直沒有名分',3),o('sex','有性關係，但沒有正式交往',3),o('ex','曾經交往，現在反覆糾纏',3,2),o('soon','他說自己快離婚或快分手',4,2),o('unclear','我也說不清楚我們到底算什麼',3))),
      q('duration','關係背景','這段關係持續多久？',opts(o('under3','3 個月內'),o('3to6','3 到 6 個月',0,1),o('6to12','6 個月到 1 年',0,2),o('1to2','1 到 2 年',1,3),o('over2','2 年以上',2,4))),
      q('appearance','關係背景','他通常什麼時候會出現？',opts(o('whenWant','他想見面時',2),o('night','晚上或半夜',3),o('low','他情緒低落時',2),o('fight','他和伴侶吵架時',4),o('need','他需要陪伴或性關係時',3),o('disappear','時間不固定，常常突然消失',4,2),o('stable','平常也會穩定聯絡'))),
      q('public','關係背景','他是否願意公開妳的存在？',opts(o('yes','願意，也有讓重要的人知道'),o('delay','嘴巴說願意，但一直拖',3),o('timing','他說現在時機不對',3),o('no','他不願意公開',4),o('secret','他要求我保密',4),o('afraid','我不敢問',4,1))),
      q('promises','關係背景','他給過妳哪些承諾？',opts(o('divorce','說會離婚',2,1),o('breakup','說會和現任分手',2,1),o('title','說以後會給我名分',2),o('timing','說目前只是時間不對',2),o('love','說他最愛的人是我',1),o('conditions','說等工作、家庭、身份或經濟問題處理完',2),o('none','沒有明確承諾'),o('many','承諾很多，但沒有實際進度',4,2)),'multiple','可複選'),
      q('need','他把妳放在哪個位置','當妳需要他時，他通常怎麼做？',opts(o('support','會陪我，也會處理問題'),o('spare','看情況，有空才出現',2),o('words','只會說幾句好聽話',3),o('gone','常常消失',4,2),o('blame','反過來怪我要求太多',4,1),o('onlyneed','只有他需要我時才會出現',4,2))),
      q('realLife','他把妳放在哪個位置','妳是否能參與他的真實生活？',opts(o('all','可以見朋友和家人'),o('some','只見過少數朋友',1),o('private','只能私下見面',3),o('photo','不能留下合照',3),o('comment','不能公開留言或互動',3),o('contact','不能在特定時間聯絡他',4),o('unknown','我幾乎不知道他的真實生活',4))),
      q('future','他把妳放在哪個位置','當妳問關係未來時，他最常怎麼回？',opts(o('action','給出明確時間與行動'),o('wait','說再等等',3),o('notnow','說現在不適合談',3),o('trust','說我不信任他',4),o('complex','說我把事情弄複雜',4),o('topic','轉移話題',3),o('cold','消失或冷處理',4,2),o('angry','生氣，讓我不敢再問',4,2))),
      q('positionFeelings','他把妳放在哪個位置','妳是否常常有這些感覺？',opts(o('girlfriend','我像女友，但沒有女友的權利',2,1),o('schedule','我只能配合他的時間',2),o('jealous','我不能吃醋',2),o('ask','我不能要求',2),o('public','我不能公開',3),o('questions','我不能問太多',3),o('good','我需要一直證明自己懂事',3,1),o('emotion','我怕一有情緒，他就消失',4,2)),'multiple','可複選'),
      q('leaveAttempt','妳為什麼離不開','妳曾經想過離開嗎？',opts(o('no','沒有，我目前還想繼續'),o('thought','有想過，但沒有真的做',0,2),o('once','試過一次',0,3,1),o('many','試過很多次',0,5,2),o('return','已經斷過，但每次又回去',0,6,3,2),o('prepare','我正在準備離開',0,2,3))),
      q('returnReason','妳為什麼離不開','通常是什麼讓妳回頭？',opts(o('kind','他突然示好',0,2),o('pity','他說自己很可憐',0,2),o('understand','他說只有我懂他',0,2),o('soon','他說很快就會處理好',0,2),o('love','我怕再也遇不到更愛的人',0,2),o('sunk','我不甘心花了這麼多時間',0,3),o('answer','我想得到一個答案',0,2),o('miss','我忍不住想他',0,2),o('abandon','我害怕他真的離開',0,3),o('chosen','我想證明自己才是他最愛的人',0,3)),'multiple','可複選'),
      q('cannotLose','妳為什麼離不開','妳最捨不得的是什麼？',opts(o('person','他這個人',0,1),o('good','他曾經對我的好',0,2),o('time','我投入的時間',0,3),o('sex','我們之間的性關係',0,2),o('special','他給我的特殊感',0,2),o('fooled','我不想承認自己被騙',0,3),o('empty','我怕下船後很空',0,3),o('promise','我還在等他兌現承諾',0,3))),
      q('fear','妳為什麼離不開','如果他今天完全不再找妳，妳最害怕什麼？',opts(o('unbearable','我會受不了',0,4),o('why','我會一直想知道原因',0,3),o('worthy','我怕自己不值得被愛',0,4),o('happy','我怕他回去過幸福生活',0,3),o('waste','我怕這幾年的付出全部白費',0,3),o('feeling','我怕再也遇不到這種感覺',0,3),o('relief','我其實會鬆一口氣',0,0,2),o('unknown','我不知道',0,1))),
      ...['我會反覆查看他的訊息或社群','他沒有回覆時，我很難專心','我的睡眠受到影響','我的工作或生活效率變差','我的情緒會被他的態度控制','我會因為他冷淡而懷疑自己','我為這段關係花了超出負擔的錢','我逐漸疏遠朋友或家人','我明知道有問題，卻沒有辦法停下來','我曾經因為這段關係失控、崩潰或做出傷害自己的行為'].map((t,i)=>q('impact'+(i+1),'生活影響程度',t,opts('完全沒有','偶爾','有時候','經常','幾乎每天').map((x,n)=>o(String(n),x)),'scale','請選擇最接近妳最近一個月的狀態')),
      q('acceptSixMonths','改變意願','如果半年後，他還是沒有離婚、沒有分手、沒有給妳名分，妳可以接受嗎？',opts(o('wait','可以，我還想等'),o('unsure','不確定',0,0,1),o('hard','很難接受',0,0,3),o('no','完全不能接受',0,0,4,1))),
      q('wanted','改變意願','妳現在最想得到什麼？',opts(o('love','確認他到底愛不愛我'),o('lie','確認他是不是在騙我',0,0,1),o('decision','知道他什麼時候會做決定'),o('worth','看清楚這段關係還值不值得等',0,0,2),o('leave','找到真正離開的方法',0,0,4,2),o('company','有人陪我下船',0,0,4,3),o('pattern','不想再遇到同類型的男人',0,0,3,2))),
      q('commitment','改變意願','如果有人陪妳處理這段關係，妳願意做到什麼程度？',opts(o('look','我只想先看看'),o('advice','我願意聽建議',0,0,1),o('change','我願意改變目前的互動方式',0,0,3),o('stop','我願意停止聯絡',0,0,4,2),o('plan','我願意照計畫執行',0,0,5,3),o('end','我已經準備好結束這個循環',0,0,5,3))),
      q('processingReadiness','改變意願','在群內，妳願意先做到哪一步？',opts(o('content','我想先繼續看內容，慢慢整理自己'),o('record','我願意開始記錄他真正做了什麼',0,0,1),o('change','我願意嘗試改變目前的互動方式',0,0,3),o('prepare','我願意開始準備斷聯與下船',0,0,4),o('apply','我願意申請一對一評估',0,0,5,3)))
    ];
    const copy={A:{title:'妳還在替他找理由',text:['妳目前還沒有真的準備離開。妳心裡仍然相信，只要再多等一下，他可能會做決定。','這段關係已經讓妳開始習慣等待、保密和配合。','現在先停止只聽他說了什麼，開始記錄他過去三個月真正做了什麼。'],primary:'回到群內看地下關係拆解'},B:{title:'妳已經知道自己被吊著',text:['妳看見很多不對勁，只是還在等一個更明確的證據，讓自己徹底死心。','妳可能已經問過很多次，他也給過很多答案。','妳手上已經有足夠訊號。接下來需要判斷，這段關係值不值得妳繼續耗下去。'],primary:'回到群內看指定案例'},C:{title:'妳知道該走，但一直走不了',text:['妳已經知道這段關係正在消耗妳。','妳也試過離開；他一回頭、一示弱、說幾句好聽話，妳又會被拉回原本的位置。','現在卡住妳的是心軟、捨不得、不甘心，還有一次次破功。妳需要一套完整的下船計畫。'],primary:'申請下船陪跑評估',secondary:'回到群內看支持內容'},D:{title:'這段關係已經開始拖垮妳的生活',text:['妳的睡眠、工作、情緒、生活或金錢，已經被這段關係明顯影響。','繼續研究他愛不愛妳，無法讓現在的狀況自動結束。','現在先把自己拉回來：建立支持、停止反覆，處理這段關係留下的影響。'],primary:'申請下船陪跑評估',secondary:'查看安全與支持資源'}};
    const highText={hanging:'妳得到的關係位置不穩定，卻被要求等待、配合與保密。',leaving:'妳已經看懂發生什麼事，只是在每次想走時，又被他的回頭拉回去。',impact:'這段關係開始占用妳的睡眠、專注力、情緒、金錢或與人的連結。'};
    const labels={hanging:'被吊著程度',leaving:'下不了船程度',impact:'生活受損程度'};
    let step=0, answers={}, sid='';
    function shell(inner){app.innerHTML='<div class="screen">'+inner+'</div>'}
    const brand=()=>'<div class="brand">壞男の臥底・群內意願檢驗</div>';
    function start(lead){const p=new URLSearchParams(location.search);const s={id:id(),startedAt:new Date().toISOString(),answers:{},clickedConsultation:false,submittedApplication:false,email:lead.email,skoolName:lead.skoolName,utmSource:p.get('utm_source')||undefined,utmCampaign:p.get('utm_campaign')||undefined};save([...sessions(),s]);localStorage.setItem(ACTIVE,s.id);pushToGoogle('lead_started',s);sid=s.id;step=0;answers={};quiz()}
    function home(){shell('<div class="home"><div>'+brand()+'<p class="eyebrow" style="margin-top:66px">群內限定・關係處理意願・約 3 分鐘</p><h1>妳已經看懂很多了。<br>現在，願意替自己做到哪一步？</h1><p class="lead">這份群內檢驗會整理妳目前的關係狀態，以及妳準備開始改變到哪裡。</p><div class="card muted">給壞男の臥底會員的關係盤點。<br><b style="color:#fff">結果會幫妳找到適合的群內內容，或判斷是否需要一對一支持。</b></div><form class="card" id="leadForm" style="margin-top:25px"><p style="font-weight:700;color:var(--mist);margin:0">對照妳的群內會員資料</p><p class="muted" style="margin:7px 0 0">用於整理群內會員的支持需求與意願，不會公開顯示。</p><label>Email<input required type="email" name="email"></label><label>Skool 名稱 / 使用者名稱<input required name="skoolName"></label><button class="btn" style="margin-top:24px">開始群內意願檢驗</button></form><p style="text-align:center;color:rgba(255,255,255,.4);font-size:12px;margin-top:16px">資料只用於群內名單對照與支持安排，不會公開。</p></div></div>');$('#leadForm').onsubmit=e=>{e.preventDefault();start(Object.fromEntries(new FormData(e.target)))}}
    function quiz(){const x=questions[step],value=answers[x.id],chosen=v=>x.kind==='scale'?Number(v)===value:Array.isArray(value)?value.includes(v):value===v;let choices=x.options.map(opt=>{let v=opt.id;return '<button type="button" class="choice '+(chosen(v)?'selected':'')+'" data-id="'+v+'"><span class="dot">'+(chosen(v)?'✓':'')+'</span>'+escape(opt.label)+'</button>'}).join('');let safety=x.id==='impact10'&&Number(value)>=3?'<div class="notice"><b>先照顧眼前的安全</b><br>如果妳目前有自傷念頭、人身安全風險、遭受暴力、跟蹤、威脅或控制，請優先聯絡當地緊急資源、專業機構或可信任的人。這份線上自評無法取代即時支持。</div>':'';shell(brand()+'<div class="progress-label"><span>'+x.section+'</span><span>'+(step+1)+' / '+questions.length+'</span></div><div class="progress"><i style="width:'+Math.round((step+1)/questions.length*100)+'%"></i></div><section class="card question '+(x.kind==='multiple'?'multiple':'')+'"><p class="eyebrow" style="margin-top:0">'+x.section+'</p><h1>'+escape(x.title)+'</h1>'+(x.desc?'<p class="desc">'+escape(x.desc)+'</p>':'')+'<div class="choices">'+choices+'</div></section>'+safety+'<div class="actions"><button type="button" class="btn alt" id="back" '+(step?'':'disabled')+'>上一步</button><button type="button" class="btn" id="next" '+(value===undefined||(Array.isArray(value)&&!value.length)?'disabled':'')+'>'+ (step===questions.length-1?'查看結果':'繼續')+'</button></div><p style="text-align:center;color:rgba(255,255,255,.35);font-size:12px">答案只儲存在這台裝置。</p>');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let v=b.dataset.id;if(x.kind==='multiple'){let a=Array.isArray(answers[x.id])?[...answers[x.id]]:[];answers[x.id]=a.includes(v)?a.filter(i=>i!==v):[...a,v]}else answers[x.id]=x.kind==='scale'?Number(v):v;update(sid,{answers});quiz()});$('#back').onclick=()=>{if(step){step--;quiz()}};$('#next').onclick=()=>{if(step<questions.length-1){step++;quiz()}else{try{finish()}catch(error){console.error(error);alert('結果整理時發生問題，請重新整理後再試一次。')}}}}
    function score(){let h=0,l=0,r=0,p=0,impact=0,critical=0;questions.forEach(x=>{let a=answers[x.id];if(a===undefined)return;if(x.kind==='scale'){impact+=Number(a);if(x.id==='impact10')critical=Number(a);return}(Array.isArray(a)?a:[a]).forEach(v=>{let z=x.options.find(o=>o.id===v);if(z){h+=z.h||0;l+=z.l||0;r+=z.r||0;p+=z.p||0}})});let hanging=Math.min(100,Math.round(h/38*100)),leaving=Math.min(100,Math.round(l/32*100)),life=Math.min(100,Math.round(impact/40*100));let highest=Object.entries({hanging,leaving,impact:life}).sort((a,b)=>b[1]-a[1])[0][0];let type=impact>=25||(impact>=18&&critical>=3)||critical>=4?'D':l>=14&&(r>=7||p>=3)?'C':h>=13||impact>=10||l>=7?'B':'A';return{type,impactTotal:impact,changeReadiness:r,leavingFailure:l,realityScore:h,paidFit:p,hangingDegree:hanging,leavingDegree:leaving,lifeImpactDegree:life,highestIndicator:highest}}
    function finish(){const scored=score();const result={...scored,resultType:scored.type,completedAt:new Date().toISOString()};update(sid,{answers,...result});const completed={...active(),...result};pushToGoogle('quiz_completed',completed);resultPage(completed)}
    function progress(label,value,highest,key){return '<div class="indicator"><div class="bar-label"><span style="'+(key===highest?'color:var(--mist);font-weight:700':'')+'">'+label+(key===highest?'・最高':'')+'</span><b>'+value+'%</b></div><div class="bar"><i class="'+(key===highest?'high':'')+'" style="width:'+value+'%"></i></div></div>'}
    function resultPage(s=active()){if(!s){home();return}const kind=s.resultType||s.type||'A',c=copy[kind],high=s.highestIndicator||'hanging';shell(brand()+'<p class="eyebrow" style="margin-top:46px">群內意願檢驗結果</p><div class="result-title"><span style="color:var(--mist);font-size:14px">結果 '+kind+' 型</span><h1>'+c.title+'</h1></div><section class="card" style="margin-top:24px"><p class="eyebrow" style="margin-top:0">三個關係訊號</p><h2 style="margin:8px 0 0;font-size:21px">妳的卡點，已經很清楚。</h2>'+progress('被吊著程度',s.hangingDegree||0,high,'hanging')+progress('下不了船程度',s.leavingDegree||0,high,'leaving')+progress('生活受損程度',s.lifeImpactDegree||0,high,'impact')+'<div class="highest"><b>妳目前最高的指標是：'+labels[high]+'</b><br>'+highText[high]+'</div></section><section class="card content" style="margin-top:22px">'+c.text.map(t=>'<p>'+t+'</p>').join('')+'</section>' +(kind==='D'?'<div class="notice"><b>先照顧眼前的安全</b><br>如果妳目前有自傷念頭、人身安全風險、遭受暴力、跟蹤、威脅或控制，請優先聯絡當地緊急資源、專業機構或可信任的人。</div>':'')+'<div class="choices" style="margin-top:22px"><button class="btn" id="primary">'+c.primary+'</button>'+(c.secondary?'<button class="btn alt" id="secondary">'+c.secondary+'</button>':'')+'</div><a class="btn alt" href="https://www.skool.com/the-scumbags-undercover-agent-1921" target="_blank" rel="noreferrer" style="display:block;text-align:center;text-decoration:none;margin-top:12px">前往壞男の臥底首頁</a><button class="btn alt" id="restart" style="margin-top:24px">重新進行檢驗</button>');$('#primary').onclick=()=>{if(['C','D'].includes(kind)){update(s.id,{clickedConsultation:true});apply()}else alert('群內指定內容連結將在正式上線時放置於此。')};if($('#secondary'))$('#secondary').onclick=()=>alert(kind==='D'?'請優先聯絡當地緊急資源、專業機構或可信任的人。':'群內支持內容連結將在正式上線時放置於此。');$('#restart').onclick=home}
    function apply(){shell(brand()+'<p class="eyebrow" style="margin-top:42px">下船陪跑・申請評估</p><h1 style="font-size:31px;line-height:1.25">把妳現在的狀況，說清楚一點。</h1><p class="muted">這份資料只用於初步評估，不會公開。請填妳願意提供的內容。</p><form class="card" id="form"><label>暱稱<input required name="nickname"></label><label>年齡區間<select required name="ageRange"><option value="">請選擇</option><option>20 歲以下</option><option>21–29 歲</option><option>30–39 歲</option><option>40–49 歲</option><option>50 歲以上</option><option>不想透露</option></select></label><label>Email<input required type="email" name="email" value="'+escape(active()?.email||'')+'"></label><label>LINE ID 或 Instagram 帳號<input required name="contact"></label><label>妳目前的關係狀態<input required name="relationshipStatus"></label><label>這段關係持續多久<input required name="duration"></label><label>妳最想解決的問題<textarea required name="problem"></textarea></label><label>妳過去試過哪些方法<textarea name="attempts"></textarea></label><label>妳為什麼現在想處理<textarea required name="whyNow"></textarea></label><label>妳是否願意投入時間與資源<select required name="investment"><option value="">請選擇</option><option>願意投入時間與資源</option><option>願意了解後再決定</option><option>目前只想先看看</option></select></label><label>如果這個方案適合妳，妳目前的狀況是？<select required name="paymentReadiness"><option value="">請選擇</option><option>我有能力，也願意近期開始</option><option>我需要先了解付款方式</option><option>我需要先了解方案內容</option><option>我目前只想看免費內容</option></select></label><label>妳是否願意接受一對一諮詢<select required name="consultation"><option value="">請選擇</option><option>願意</option><option>想先了解</option><option>暫時不考慮</option></select></label><button class="btn" style="margin-top:24px">送出陪跑申請</button></form>');$('#form').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target)),record={...active(),application:{...data,submittedAt:new Date().toISOString()},submittedApplication:true};update(active().id,record);pushToGoogle('application_submitted',record);shell('<div class="screen"><div style="min-height:75vh;display:flex;align-items:center"><div>'+brand()+'<section class="card" style="margin-top:34px"><p class="eyebrow" style="margin-top:0">申請已送出</p><h1 style="font-size:30px">已收到妳的申請</h1><p class="muted">這不是自動錄取。<br>我們會先確認妳的狀況，以及目前是否適合進入陪跑。</p><button class="btn" id="done">回到首頁</button></section></div></div></div>');$('#done').onclick=home}}
    function admin(){let all=sessions(),done=all.filter(s=>s.completedAt),n=t=>done.filter(s=>s.resultType===t).length;let metrics=[['總測驗人數',all.length],['完成人數',done.length],['完成率',all.length?Math.round(done.length/all.length*100)+'%':'—'],['點擊申請',all.filter(s=>s.clickedConsultation).length],['送出申請',all.filter(s=>s.submittedApplication).length],['A 型',n('A')],['B 型',n('B')],['C / D 型',n('C')+' / '+n('D')]];let dists=questions.map(x=>{let counts={};all.forEach(s=>{let v=s.answers?.[x.id];(Array.isArray(v)?v:[v]).filter(v=>v!==undefined).forEach(v=>counts[v]=(counts[v]||0)+1)});return '<article class="card admin-q"><p class="eyebrow" style="margin-top:0">'+x.section+'</p><h3>'+x.title+'</h3>'+x.options.map(z=>{let c=counts[z.id]||0,p=all.length?Math.round(c/all.length*100):0;return '<div class="dist"><span><em style="font-style:normal">'+z.label+'</em><b>'+c+'・'+p+'%</b></span><i style="width:'+p+'%"></i></div>'}).join('')+'</article>'}).join('');shell(brand()+'<p class="eyebrow" style="margin-top:42px">本機資料儀表板</p><h1 style="font-size:30px">入群檢驗概況</h1><p class="muted">資料只儲存在這台裝置。</p><div class="row"><button class="btn alt" id="json">匯出 JSON</button><button class="btn" id="csv">匯出 CSV</button></div><div class="metrics">'+metrics.map(m=>'<div class="card metric"><small>'+m[0]+'</small><strong>'+m[1]+'</strong></div>').join('')+'</div><h2>每題選項分布</h2>'+dists);const download=(name,text,type)=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)};$('#json').onclick=()=>download('壞男の臥底-資料.json',JSON.stringify(all,null,2),'application/json');$('#csv').onclick=()=>{let head=['id','email','skoolName','startedAt','completedAt','resultType','impactTotal','clickedConsultation','submittedApplication','answers'];let rows=all.map(s=>head.map(k=>'"'+String(k==='answers'?JSON.stringify(s.answers):s[k]??'').replaceAll('"','""')+'"').join(','));download('壞男の臥底-資料.csv',[head.join(','),...rows].join('\n'),'text/csv;charset=utf-8')}}
    if(location.hash==='#admin')admin();else home();
  })();
  </script>
